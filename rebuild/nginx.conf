worker_processes 1;
daemon off;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3000;
        server_name localhost;

        # Spawner API
        location /api/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # Dynamic per-user routes (written by spawner)
        include /etc/nginx/user-routes/*.conf;

        # Landing page
        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>podserver</title></head>
<body>
<h1>podserver</h1>
<p>Multi-user sandboxed VS Code server.</p>
<h2>Usage</h2>
<pre>
# Spawn a user workspace:
curl -X POST -H "Content-Type: application/json" \
     -d &apos;{"username":"alice"}&apos; \
     http://localhost:3000/api/spawn

# Then open in browser:
#   http://localhost:3000/user/alice/

# Check status:
curl http://localhost:3000/api/status

# Health check:
curl http://localhost:3000/api/health
</pre>
</body>
</html>';
        }
    }
}
